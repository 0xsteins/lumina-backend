version: "3.9"

services:
  # PostgreSQL — stores indexed Stellar network data
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lumina
      POSTGRES_USER: lumina
      POSTGRES_PASSWORD: lumina_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

  # Lumina Indexer — polls Horizon and writes to PostgreSQL
  indexer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.indexer
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://lumina:lumina_dev@postgres:5432/lumina
      HORIZON_URL: https://horizon.stellar.org
      POLL_INTERVAL_MS: "5000"
      # Conservative pacing for anonymous public Horizon access — its
      # sustained per-IP rate limit is much lower than a burst-only throttle
      # accounts for (confirmed live: even 10 req/sec sustained 429'd).
      HORIZON_MIN_REQUEST_INTERVAL_MS: "1000"
      # Uncomment to start from a specific ledger:
      # START_LEDGER: "52000000"
      # Soroban contract event indexing — enabled by default, pointed at the
      # deployed testnet Lumina Registry (see contracts/DEPLOY.md in
      # lumina-contracts). Unset these to disable event indexing entirely.
      SOROBAN_RPC_URL: "https://soroban-testnet.stellar.org"
      INDEXED_CONTRACT_IDS: "CAYUDQPV3RKPM3EXDFGI3457FV677JLUCJ4OLKWGCUBPRIHYKXK3WFAZ"
      REGISTRY_CONTRACT_ID: "CAYUDQPV3RKPM3EXDFGI3457FV677JLUCJ4OLKWGCUBPRIHYKXK3WFAZ"
      REGISTRY_READ_ACCOUNT: "GBWKFFXZ5CJESIHP2EOID5IOXMF472RO5XOJ36X475D5LJGI3AF5R5KY"

  # Lumina GraphQL Server — serves indexed data via GraphQL API
  graphql:
    build:
      context: ..
      dockerfile: docker/Dockerfile.graphql
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://lumina:lumina_dev@postgres:5432/lumina
      PORT: "4000"
    ports:
      - "127.0.0.1:4000:4000"

volumes:
  postgres_data:
